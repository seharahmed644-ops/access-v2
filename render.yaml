services:
  - type: web
    name: access-opportunities
    runtime: python
    plan: free
    buildCommand: echo "No dependencies to install"
    startCommand: python3 server.py
    healthCheckPath: /api/health
    renderSubdomainPolicy: enabled
    envVars:
      - key: ACCESS_HOST
        value: 0.0.0.0
      - key: ACCESS_ADMIN_EMAIL
        sync: false
      - key: ACCESS_ADMIN_PASSWORD
        sync: false
