services:
  - type: web
    name: access-opportunities
    runtime: python
    plan: free
    buildCommand: cat server_parts/01.py server_parts/02.py server_parts/03.py > server.py
    startCommand: python3 server.py
    healthCheckPath: /api/health
    renderSubdomainPolicy: enabled
    envVars:
      - key: ACCESS_HOST
        value: 0.0.0.0
      - key: ACCESS_ADMIN_EMAIL
        sync: false
      - key: ACCESS_ADMIN_PASSWORD
        sync: false
